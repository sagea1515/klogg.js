    <div style="background: #252526; color: #fff; padding: 10px; font-family: sans-serif; max-width: 930px; margin: 0 auto;">
      <!-- System Resource Health Status Tracker Bar -->
      <div style="display: flex; justify-content: space-between; font-size: 11px; background: #1e1e1e; padding: 4px 8px; border-radius: 4px; margin-bottom: 8px; border: 1px solid #333;">
        <div>System RAM: <span id="sysRamMetric">--</span> GB</div>
        <div id="heapContainer" style="color: #aaaaaa;">
          Tab Memory: <span id="usedHeapMetric">0</span> MB / <span id="limitHeapMetric">4000</span> MB
        </div>
      </div>

      <!-- Query Control Panel -->
      <div style="display: flex; gap: 10px; align-items: center; margin-bottom: 10px;">
        <button id="openFileBtn" style="padding: 6px 12px; background: #0e639c; color: white; border: none; border-radius: 4px; cursor: pointer;">Open Log</button>

        <div style="position: relative; flex-grow: 1;">
          <!-- Transition styles for when regex fails validation -->
          <input type="text" id="searchInput" placeholder="Enter regex pattern (e.g., ERROR|WARN)..." style="width: 100%; padding: 6px; background: #3c3c3c; border: 1px solid #6b6b6b; color: #fff; border-radius: 4px; font-family: monospace; transition: all 0.2s ease;">
        </div>

        <label style="font-size: 13px; display: flex; align-items: center; gap: 4px; white-space: nowrap;">
          <input type="checkbox" id="filterModeCheckbox"> Matches only
        </label>
        <label style="font-size: 13px; display: flex; align-items: center; gap: 4px; color: #00ff66; white-space: nowrap;">
          <input type="checkbox" id="tailModeCheckbox"> Live Tail
        </label>

        <!-- Expanded search metrics for step counters -->
        <span id="searchMetrics" style="font-size: 13px; color: #aaaaaa; white-space: nowrap; min-width: 140px; text-align: right;">0 matches found</span>
      </div>

      <!-- Unified Viewport and Minimap Layout -->
      <div style="display: flex; position: relative; border: 1px solid #3c3c3c;">
        <div style="flex-grow: 1; overflow-x: auto; background: #1e1e1e;">
          <div id="scrollViewport" style="height: 500px; overflow-y: auto; overflow-x: hidden; position: relative;">
            <div id="scrollPhantom" style="position: absolute; width: 100%; top: 0; left: 0; pointer-events: none;"></div>
            <div id="visibleLinesContainer" style="position: absolute; top: 0; left: 0; width: max-content; min-width: 100%;"></div>
          </div>
        </div>
        <canvas id="minimapCanvas" width="30" height="500" style="background: #252526; cursor: pointer; border-left: 1px solid #3c3c3c; user-select: none; flex-shrink: 0;"></canvas>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
